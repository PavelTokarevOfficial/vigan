<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Поиск клипов Twitch по нику стримера" />
    <title>Finde Clip — Twitch Clips</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Twitch Clips</h1>
      <p class="subtitle">Найдите клипы стримера по Twitch-нику.</p>

      <form id="search-form" class="search-form">
        <label class="sr-only" for="username">Twitch username</label>
        <input id="username" value="Defect_TRUE" name="username" type="text" placeholder="Введите Twitch username" autocomplete="off" required />
        <button type="submit">Найти</button>
      </form>

      <section class="filters" aria-label="Фильтры клипов">
        <label>
          Период
          <select id="period" name="period">
            <option value="">За всё время</option>
            <option value="1">Последние 24 часа</option>
            <option value="7">Последние 7 дней</option>
            <option value="30">Последние 30 дней</option>
            <option value="90">Последние 3 месяца</option>
            <option value="365">Последний год</option>
            <option value="custom">Свой период</option>
          </select>
        </label>
        <label id="date-from-wrap" hidden>
          От
          <input id="date-from" type="date" />
        </label>
        <label id="date-to-wrap" hidden>
          До
          <input id="date-to" type="date" />
        </label>
        <label>
          Минимум просмотров
          <input id="min-views" type="number" min="0" step="1" value="0" inputmode="numeric" />
        </label>
        <p class="filter-note">Twitch сортирует результаты по просмотрам. Рейтинга у клипов в API нет.</p>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
      <section id="clips" class="clips-grid" aria-live="polite"></section>
      <button id="load-more" class="load-more" type="button" hidden>Загрузить ещё</button>

      <section class="library" aria-labelledby="library-title">
        <div class="library-heading">
          <div>
            <h2 id="library-title">Скачанные видео</h2>
            <p>Файлы из локальной папки <code>downloads/</code>.</p>
          </div>
          <button id="refresh-downloads" type="button">Обновить</button>
        </div>
        <p id="library-status" class="status" aria-live="polite"></p>
        <section id="downloads" class="downloads-grid" aria-live="polite"></section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
